services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: eventflow
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
  backend:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /app
    volumes: ["./backend:/app"]
    command: mvn spring-boot:run
    environment:
      DB_USER: root
      DB_PASSWORD: root
    ports: ["8080:8080"]
    depends_on: [mysql]
  frontend:
    image: node:22
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [backend]