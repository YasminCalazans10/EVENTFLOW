services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: eventflow
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - eventflow_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /app
    volumes:
      - "./backend:/app"
    command: mvn spring-boot:run
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: eventflow
      DB_USER: root
      DB_PASSWORD: root
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: node:22
    working_dir: /app
    volumes:
      - "./frontend:/app"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  eventflow_mysql_data:
